<section class="pg"><h1>Contact us</h1><div class="grid">
<article class="glass rv"><h3>Email</h3><p><a href="mailto:cyber.shield@example.com">cyber.shield@example.com</a><br><span class="tag">Placeholder: replace with the official club email.</span></p></article>

<div class="field"><label for="m">Message</label><textarea id="m" name="Message" rows="5" required minlength="10" maxlength="1000"></textarea></div>
