<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; base-uri 'self'">
<meta name="description" content="BIT Cyber Shield Club at Baobab Institute of Tanzania. Securing the Digital Future.">
<title>Join Us | BIT Cyber Shield Club</title><link rel="icon" href="assets/logo.svg"><link rel="stylesheet" href="css/style.css"></head>
<body><a class="skip" href="#main">Skip to content</a><canvas id="bg" aria-hidden="true"></canvas><header id="hdr"></header><main id="main">
<section class="pg"><h1>Join the club</h1>
<div class="grid"><article class="glass rv"><h3>Who can join?</h3><p>Any registered BIT student, from any course. No experience needed.</p></article><article class="glass rv"><h3>What you get</h3><p>Workshops, mentoring, CTF practice, project teams and career guidance.</p></article><article class="glass rv"><h3>What we expect</h3><p>Ethical behavior, respect for others and legal use of all skills.</p></article></div>
<form data-subject="Membership application">
<div class="field"><label for="n">Full name</label><input id="n" name="Full name" required minlength="2" maxlength="80" autocomplete="name"></div>
<div class="field"><label for="r">Student registration number</label><input id="r" name="Registration number" required pattern="[A-Za-z0-9\/\-]{4,25}" title="4 to 25 letters, numbers, / or -" maxlength="25"></div>
<div class="field"><label for="c">Course</label><input id="c" name="Course" required minlength="2" maxlength="80"></div>
<div class="field"><label for="e">Email address</label><input id="e" name="Email" type="email" required maxlength="120" autocomplete="email"></div>
<div class="field"><label for="i">Area of interest</label><select id="i" name="Interest" required><option value="">Choose one</option><option>Ethical Hacking and Penetration Testing</option><option>Network Security</option><option>Digital Forensics</option><option>Security Research</option><option>Web Development</option><option>Cybersecurity Awareness</option><option>AI and Innovation</option></select></div>
<div class="field"><label><input type="checkbox" required class="chk"> I will only use my skills legally and with permission.</label></div>
<button class="btn" type="submit">Submit application</button><p class="ok" role="status" hidden></p></form></section>
</main><footer id="ftr"></footer><button id="top" aria-label="Back to top" hidden>&uarr;</button><script src="js/script.js" defer></script></body></html>
